name: Validate
on: [push, pull_request, workflow_dispatch]
jobs:
  rust:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: choco install ripgrep --no-progress -y
      - run: cargo build --locked --release
      - shell: pwsh
        run: ./scripts/build_cpp_fixture.ps1
      - run: python scripts/validate_native.py --cpp
      - shell: pwsh
        run: |
          $results = Get-ChildItem target/runtime-validation/run-*/results.json | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          python scripts/validate_reprocess.py $results.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate_exception_layouts.py $results.FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-validation
          path: target/runtime-validation/
