[package]
name = "sigbraker"
version = "1.0.0"
edition = "2021"
description = "SigBreaker 1.0 — binary diversification engine for x86-64 PE files: segment selector injection, instruction reordering, and basic block shuffling."
license = "MIT"
repository = "https://example.invalid/sigbraker"
keywords = ["binary", "obfuscation", "diversification", "pe", "x86"]
categories = ["command-line-utilities", "encoding"]

[lib]
name = "sigbraker"
path = "src/lib.rs"

[[bin]]
name = "sigbraker"
path = "src/main.rs"

[features]
default = ["tui"]
tui = ["dep:ratatui"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
iced-x86 = { version = "1.22", features = ["decoder", "encoder", "instr_info"] }
rand = "0.8"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "unstable-rendered-line-info"], optional = true }

[profile.release]
lto = true
codegen-units = 1
